<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#082c1c" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#082c1c" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f7faf8"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Floating URL Bar Pill -->
  <g filter="url(#cardShadow)">
    <rect x="195" y="64" width="410" height="48" rx="24" fill="#082c1c"/>
    <circle cx="225" cy="88" r="10" fill="#10b981"/>
    <path d="M221 88 L224 91 L230 85" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="246" y="94" fill="#ffffff" font-family="monospace" font-size="15" font-weight="600">numu.in/profile/</text>
    <text x="388" y="94" fill="#cff07c" font-family="monospace" font-size="15" font-weight="700">aarav-sharma</text>
    <rect x="515" y="74" width="76" height="28" rx="14" fill="#cff07c"/>
    <text x="531" y="92" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">PUBLIC</text>
  </g>

  <!-- Main Verified Developer Profile Card -->
  <g filter="url(#cardShadow)">
    <rect x="115" y="138" width="570" height="390" rx="26" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Avatar + Name Header -->
    <rect x="155" y="176" width="76" height="76" rx="22" fill="#082c1c"/>
    <text x="172" y="224" fill="#cff07c" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">AS</text>
    <circle cx="222" cy="242" r="13" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <path d="M217 242 L220.5 245.5 L227.5 238.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="252" y="206" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Aarav Sharma</text>
    <text x="252" y="232" fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600">Final-Year CSE · Full-Stack &amp; Algorithms</text>

    <!-- Knight Tier Badge -->
    <rect x="528" y="182" width="118" height="36" rx="18" fill="#cff07c"/>
    <text x="546" y="205" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">★ Level 4 Pro</text>

    <!-- 3 Verified Stat Boxes -->
    <rect x="155" y="278" width="150" height="96" rx="16" fill="#f3f7f4" stroke="#d1e7dd" stroke-width="1"/>
    <text x="175" y="322" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800">164</text>
    <text x="175" y="350" fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Problems Solved</text>

    <rect x="325" y="278" width="150" height="96" rx="16" fill="#f3f7f4" stroke="#d1e7dd" stroke-width="1"/>
    <text x="345" y="322" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800">94.2%</text>
    <text x="345" y="350" fill="#4b5563" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Mock Test Score</text>

    <rect x="495" y="278" width="150" height="96" rx="16" fill="#082c1c"/>
    <text x="515" y="322" fill="#cff07c" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800">Top 2%</text>
    <text x="515" y="350" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Campus Rank</text>

    <!-- Verified Track Badges -->
    <text x="155" y="412" fill="#6b7280" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">VERIFIED SKILL TRACKS</text>

    <rect x="155" y="428" width="128" height="38" rx="12" fill="#e2f3ea"/>
    <text x="173" y="452" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ DSA &amp; Judge0</text>

    <rect x="295" y="428" width="142" height="38" rx="12" fill="#e2f3ea"/>
    <text x="313" y="452" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ Full-Stack Dev</text>

    <rect x="449" y="428" width="146" height="38" rx="12" fill="#e2f3ea"/>
    <text x="467" y="452" fill="#082c1c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ System Design</text>
  </g>
</svg>

